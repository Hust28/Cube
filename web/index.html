<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CubeRush 3D</title>
    <meta name="theme-color" content="#090D16" />
    <meta name="description" content="Twist. Learn. Solve. Dominate. Premium 3D Rubik's Cube with AI camera scanner, two-phase solver, learning academy, and speedcubing timer." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* Safe area insets for mobile notched devices */
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #090D16;
        color: #F3F4F6;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(9, 13, 22, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.4);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.8);
      }
    </style>
  </head>
  <body class="bg-cyber-bg text-gray-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
